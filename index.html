<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>흔열 채용 트래커</title>
<style>
  :root {
    --bg: #f7f7f8; --card-bg: #ffffff; --border: #e6e6ea; --text: #2b2b33; --text-sub: #8a8a94;
    --lavender-bg: #e9e4fb; --lavender-fg: #5f4dc7;
    --mint-bg: #d9f3e7;     --mint-fg: #1d8a66;
    --coral-bg: #fde2dc;    --coral-fg: #d4523a;
    --green-bg: #e4f3e7;    --green-fg: #3d8a4e;
    --amber-bg: #fdf1dc;    --amber-fg: #b07b23;
    --blue-bg: #e3eefb;     --blue-fg: #2f6db5;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  @media (min-width: 600px) { .container { padding: 28px 24px 48px; } }

  header.page-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  header.page-header .hgroup { flex: 1; min-width: 200px; }
  header.page-header h1 { font-size: 22px; font-weight: 700; color: var(--mint-fg); }
  header.page-header p { color: var(--text-sub); font-size: 14px; margin-top: 2px; }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; }

  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .stat { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; font-size: 13.5px; color: var(--text-sub); }
  .stat b { font-size: 18px; color: var(--text); margin-right: 3px; font-variant-numeric: tabular-nums; }
  .stat.hot b { color: var(--coral-fg); }
  .stat.new b { color: var(--green-fg); }
  .stat.app b { color: var(--blue-fg); }

  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; scrollbar-width: thin; }
  .tab {
    border: 1px solid var(--border); background: var(--card-bg); color: var(--text); white-space: nowrap;
    border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer;
  }
  .tab .n { color: var(--text-sub); font-weight: 500; margin-left: 3px; }
  .tab[aria-selected="true"] { background: var(--mint-fg); border-color: var(--mint-fg); color: #fff; }
  .tab[aria-selected="true"] .n { color: rgba(255,255,255,.8); }
  .section-desc { font-size: 13.5px; color: var(--text-sub); margin: 2px 0 12px; }

  .subfilters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { border: 1px solid var(--border); background: var(--card-bg); color: var(--text-sub); border-radius: 999px; padding: 4px 10px; font-size: 13px; font-family: inherit; cursor: pointer; }
  .chip[aria-pressed="true"] { border-color: var(--mint-fg); color: var(--mint-fg); font-weight: 600; }

  .job-list { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 860px) { .job-list { grid-template-columns: 1fr 1fr; } }
  .job-list .full { grid-column: 1 / -1; }
  .job-list > * { min-width: 0; }

  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; }
  .card.top { border-left: 3px solid var(--coral-fg); }
  .card.muted { opacity: .62; }

  .badge { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; flex-shrink: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .badge.new { background: var(--green-bg); color: var(--green-fg); }
  .badge.plain { background: var(--bg); color: var(--text-sub); border: 1px solid var(--border); }
  .badge.warn { background: var(--amber-bg); color: var(--amber-fg); }
  .badge.bad { background: var(--coral-bg); color: var(--coral-fg); }
  .badge.good { background: var(--mint-bg); color: var(--mint-fg); }
  .badge.blue { background: var(--blue-bg); color: var(--blue-fg); }
  .badge.purple { background: var(--lavender-bg); color: var(--lavender-fg); }

  .dday { font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--bg); color: var(--text-sub); white-space: nowrap; flex-shrink: 0; }
  .dday.urgent { background: var(--coral-bg); color: var(--coral-fg); }
  .dday.rolling { background: var(--mint-bg); color: var(--mint-fg); }

  .job-top { display: flex; align-items: flex-start; gap: 8px; }
  .job-titles { flex: 1; min-width: 0; }
  .job-title { font-weight: 700; font-size: 16px; color: var(--text); display: block; word-break: keep-all; }
  a.job-title { color: var(--mint-fg); text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 3px; }
  a.job-title:hover { text-decoration-color: currentColor; }
  .job-title .ext-icon { font-size: 13px; opacity: 0.6; margin-left: 3px; }
  .card, .job-titles, .job-note, .sources, .job-reason { overflow-wrap: anywhere; }
  .job-company { font-size: 14px; color: var(--text-sub); margin-top: 2px; }
  .job-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .job-reason { font-size: 13.5px; margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: var(--bg); }
  .job-reason .lbl { font-weight: 700; margin-right: 4px; }
  .job-reason.no { color: var(--coral-fg); }
  .job-note { font-size: 13px; color: var(--text-sub); margin-top: 6px; }
  .sources { font-size: 12.5px; color: var(--text-sub); margin-top: 6px; }
  .sources a { color: var(--text-sub); }
  .job-bottom { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 10px; }
  select.status-select, .field { flex: 1; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 13.5px; font-family: inherit; color: var(--text); background: var(--card-bg); min-width: 0; }
  .del-btn { border: none; background: none; color: #c9c9d1; font-size: 18px; line-height: 1; cursor: pointer; padding: 4px 2px 4px 6px; flex-shrink: 0; }
  .del-btn:hover { color: var(--coral-fg); }

  .btn { height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--card-bg); color: var(--text-sub); font-size: 13.5px; font-weight: 600; font-family: inherit; cursor: pointer; flex-shrink: 0; }
  .btn:hover { color: var(--mint-fg); border-color: var(--mint-fg); }
  .btn.primary { background: var(--mint-fg); border-color: var(--mint-fg); color: #fff; }

  .panel { display: none; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; padding: 12px; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); }
  .panel.open { display: flex; }
  .panel input, .panel select, .panel textarea { flex: 1; min-width: 120px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; font-family: inherit; color: var(--text); background: var(--card-bg); }
  .panel input[type="date"] { flex: 0 1 150px; }
  .panel input[type="url"], .panel textarea { flex: 1 1 100%; }
  .panel .hint { flex: 1 1 100%; font-size: 13px; color: var(--text-sub); }

  .more-btn, .toggle-btn { display: block; width: 100%; margin-top: 4px; padding: 9px; background: none; border: 1px dashed var(--border); border-radius: 8px; color: var(--text-sub); font-size: 14.5px; font-weight: 600; font-family: inherit; cursor: pointer; }
  .more-btn:hover, .toggle-btn:hover { background: var(--card-bg); }
  .empty-msg { color: var(--text-sub); font-size: 14.5px; padding: 18px 4px; text-align: center; }

  table.app-table { width: 100%; border-collapse: collapse; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; font-size: 14px; }
  .app-table th, .app-table td { padding: 9px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  .app-table th { background: var(--bg); font-size: 13px; color: var(--text-sub); font-weight: 600; }
  .app-table td.sub { color: var(--text-sub); font-size: 13px; }
  .app-table a { color: var(--mint-fg); font-weight: 700; }
  .table-wrap { overflow-x: auto; }
  .legend { font-size: 12.5px; color: var(--text-sub); margin-top: 22px; line-height: 1.7; }
  .src-health { font-size: 12.5px; color: var(--text-sub); margin-top: 8px; }
  .src-health span { display: inline-block; margin-right: 10px; white-space: nowrap; }
</style>
</head>
<body>
<div class="container">

  <header class="page-header">
    <div class="hgroup">
      <h1>흔열 채용 트래커</h1>
      <p id="today-date"></p>
      <p id="last-updated"></p>
    </div>
    <div class="tools">
      <button class="btn" id="add-toggle" type="button">＋ 공고 직접 추가</button>
      <button class="btn" id="app-toggle" type="button">＋ 지원 기록</button>
      <button class="btn" id="backup-btn" type="button" title="지원 현황·상태를 파일로 저장">백업</button>
      <button class="btn" id="restore-btn" type="button" title="백업 파일 불러오기">복원</button>
      <input type="file" id="restore-file" accept="application/json,.json" hidden>
    </div>
  </header>

  <form class="panel" id="add-form">
    <input type="text" id="add-title" placeholder="공고 제목" maxlength="100" required>
    <input type="text" id="add-company" placeholder="회사명" maxlength="60">
    <input type="date" id="add-deadline" title="지원 마감일 (실제 지원처 기준)">
    <input type="url" id="add-url" placeholder="공고 링크 (URL)">
    <button type="submit" class="btn primary">추가</button>
  </form>

  <form class="panel" id="app-form">
    <input type="text" id="app-company" placeholder="회사명" maxlength="60" required>
    <input type="text" id="app-title" placeholder="포지션 (선택)" maxlength="100">
    <select id="app-status"></select>
    <input type="date" id="app-date" title="지원일 또는 기준일">
    <input type="url" id="app-url" placeholder="공고 링크 (선택)">
    <textarea id="app-memo" rows="2" placeholder="메모 (선택)"></textarea>
    <span class="hint">지원 기록은 이 브라우저에만 저장되고 공개 사이트에는 올라가지 않습니다. 다른 기기에서도 보려면 백업 파일을 옮겨 복원하세요.</span>
    <button type="submit" class="btn primary">기록 추가</button>
  </form>

  <div class="stats" id="stats"></div>
  <div class="tabs" id="tabs" role="tablist" aria-label="보기 구분"></div>
  <p class="section-desc" id="section-desc"></p>
  <div class="subfilters" id="subfilters"></div>
  <div class="job-list" id="job-list"></div>

  <p class="legend">
    공고 상태(모집 중·마감·확인 필요)는 자동 수집 결과이고, 지원 상태는 이 브라우저에만 저장됩니다. 공고가 마감돼도 지원 기록은 지워지지 않습니다.<br>
    마감일은 실제 지원처(회사 채용페이지) 기준이며, 출처마다 다르면 "확인 필요"로 표시합니다. 연봉 등 확인되지 않은 정보는 표시하지 않습니다.
  </p>
  <div class="src-health" id="src-health"></div>
</div>

<script>
(function () {
  'use strict';

  // ---------- 상수 ----------
  var POSTING_STATUSES = ['지원 전', '지원 준비', '서류 준비', '지원 완료', '서류 합격', '면접 진행', '최종 결과 대기', '합격', '불합격', '보류', '관심없음'];
  var APP_STATUSES = ['관심', '지원 준비', '서류 준비', '지원 완료', '서류 합격', '면접 진행', '최종 결과 대기', '합격', '불합격', '보류'];
  var USER_CLOSED = ['합격', '불합격', '관심없음'];
  var APPLIED = ['지원 완료', '서류 합격', '면접 진행', '최종 결과 대기', '합격', '불합격'];
  var NEW_DAYS = 7, SOON_DAYS = 7, STALE_WARN = 7, STALE_DROP = 14, VISIBLE = 12;

  // 수집 데이터에 적합도가 없을 때만 쓰는 보조 분류 (정렬용, 점수 아님)
  var GROUPS = [
    { key: 'ai', label: 'AI 콘텐츠·중국계 기술', kw: ['Meitu','美图','메이투','ByteDance','字节','바이트댄스','TikTok','틱톡','CapCut','캡컷','Dreamina','MiniMax','미니맥스','Kuaishou','快手','콰이쇼우','Kling','클링','Tencent','腾讯','텐센트','Alibaba','阿里','알리바바','PixVerse','Vidu','生数','HoYoverse','米哈游','호요버스','NetEase','网易','넷이즈','Xiaohongshu','小红书','샤오홍슈','Bilibili','哔哩','빌리빌리','中文在线'] },
    { key: 'global', label: '글로벌 OTT·스튜디오', kw: ['Netflix','넷플릭스','Disney','디즈니','Amazon','아마존','Apple','애플','YouTube','유튜브','Warner','워너','Sony','소니','iQIYI','아이치이','爱奇艺','ReelShort','릴숏','DramaBox','드라마박스','点众'] },
    { key: 'kr', label: '국내 OTT·스튜디오', kw: ['티빙','TVING','웨이브','Wavve','CJ ENM','스튜디오드래곤','Studio Dragon','스튜디오지니','KT스튜디오지니','카카오엔터','NAVER WEBTOON','네이버웹툰','키다리','레진','리디','RIDI','스푼랩스','Vigloo','비글루','Playlist','플레이리스트','SLL','JTBC','NEW','쇼박스','롯데컬처웍스','HYBE','하이브','쿠팡플레이','KBS','MBC','SBS'] },
    { key: 'hh', label: '헤드헌팅', kw: ['엔터웨이','유니코써치','커리어케어','피플케어','Robert Walters','Michael Page','Hays','헤드헌팅'] }
  ];
  function groupOf(raw) {
    var hay = (raw.company || '') + ' ' + (raw.title || '');
    for (var i = 0; i < GROUPS.length; i++)
      for (var j = 0; j < GROUPS[i].kw.length; j++)
        if (hay.indexOf(GROUPS[i].kw[j]) !== -1) return GROUPS[i];
    return null;
  }

  // ---------- 로컬 저장 ----------
  var LS = {
    get: function (k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return (v === null || v === undefined) ? d : v; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  var overrides = LS.get('job.overrides', {});          // 공고별 개인 상태 (기존 키 유지)
  var manual = LS.get('job.manual', []).filter(function (m) { return m.person !== 'me'; });
  var apps = LS.get('job.applications', []);             // 지원 현황 (공고와 별개, 삭제 안 됨)
  var interests = LS.get('job.interests', null);         // 관심 기업
  if (interests === null) { interests = ['Netflix', 'Disney']; LS.set('job.interests', interests); }
  function saveAll() { LS.set('job.overrides', overrides); LS.set('job.manual', manual); LS.set('job.applications', apps); LS.set('job.interests', interests); }

  // ---------- 날짜 ----------
  var days = ['일', '월', '화', '수', '목', '금', '토'];
  var now = new Date();
  document.getElementById('today-date').textContent = now.getFullYear() + '년 ' + (now.getMonth() + 1) + '월 ' + now.getDate() + '일 (' + days[now.getDay()] + ')';
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function todayStr() { var t = new Date(); return t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate()); }
  function today0() { var t = new Date(); t.setHours(0, 0, 0, 0); return t; }
  function diffDays(s) { return Math.round((new Date(s + 'T00:00:00') - today0()) / 86400000); }
  function daysSince(s) { return s ? -diffDays(s.slice(0, 10)) : Infinity; }
  function md(s) { var p = s.slice(0, 10).split('-'); return (+p[1]) + '/' + (+p[2]); }
  function hashId(str) { var h = 0; for (var i = 0; i < str.length; i++) h = ((h << 5) - h + str.charCodeAt(i)) | 0; return 'j' + Math.abs(h).toString(36); }
  function uid() { return 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  // ---------- 지원 현황 ↔ 공고 상태 연결 ----------
  function appForPosting(id) { for (var i = 0; i < apps.length; i++) if (apps[i].postingId === id) return apps[i]; return null; }
  function upsertAppFromPosting(raw, status) {
    var a = appForPosting(raw.id);
    if (status === '지원 전' || status === '관심없음') { if (a && a.auto) { apps = apps.filter(function (x) { return x !== a; }); } return; }
    if (!a) { a = { id: uid(), postingId: raw.id, auto: true, company: raw.company || '', title: raw.title || '', url: raw.url || '', date: todayStr(), memo: '' }; apps.push(a); }
    a.status = status === '면접 예정' ? '면접 진행' : status;
    a.updated = todayStr();
  }
  // 예전 데이터 이전: 공고에 '지원 완료' 등으로 표시했던 기록을 지원 현황으로 옮김
  (function migrate() {
    var changed = false;
    Object.keys(overrides).forEach(function (id) {
      var st = overrides[id].status;
      if (st && st !== '지원 전' && st !== '관심없음' && !appForPosting(id)) {
        apps.push({ id: uid(), postingId: id, auto: true, company: '', title: '(기존 기록) ' + id, url: '', date: todayStr(), status: st === '면접 예정' ? '면접 진행' : st, memo: '' });
        changed = true;
      }
    });
    if (changed) saveAll();
  })();

  // ---------- 데이터 ----------
  var discovered = [], companies = { companies: [], trends: [] }, meta = null;
  var tab = 'recommend', sub = 'all', expanded = false;

  function getOv(id) { return overrides[id] || { status: '지원 전', dismissed: false }; }
  function setOv(id, patch) { var o = getOv(id); for (var k in patch) o[k] = patch[k]; overrides[id] = o; }

  // 공고 하나를 분류
  function classify(raw) {
    var ov = getOv(raw.id);
    var it = { raw: raw, status: ov.status || '지원 전', dismissed: !!ov.dismissed, group: groupOf(raw) };
    if (it.status === '면접 예정') it.status = '면접 진행';
    var postingState = raw.status || 'open';                 // open | closed | unreachable | check
    it.state = postingState;
    if (raw.deadline) {
      var d = diffDays(raw.deadline);
      it.dday = { label: d === 0 ? '마감 D-DAY' : (d > 0 ? '마감 D-' + d : '마감 ' + md(raw.deadline)), urgent: d >= 0 && d <= 3, sort: d };
      if (d < 0) it.expired = true;
    } else {
      it.dday = { label: '상시 채용', rolling: true, sort: 1000 };
      var age = raw.source === '직접입력' ? 0 : daysSince(raw.checkedDate || raw.lastChecked || raw.foundDate);
      it.stale = age > STALE_WARN;
      it.veryStale = age > STALE_DROP;
    }
    // 출처별 마감일 불일치
    if (Array.isArray(raw.sources) && raw.sources.length > 1) {
      var dl = raw.sources.map(function (s) { return s.deadline || ''; }).filter(Boolean);
      it.deadlineMismatch = dl.some(function (x) { return x !== dl[0]; });
    }
    it.closed = postingState === 'closed' || !!it.expired;
    it.needsCheck = !it.closed && (postingState === 'unreachable' || postingState === 'check' || it.veryStale || it.deadlineMismatch);
    it.applied = APPLIED.indexOf(it.status) !== -1;
    it.userClosed = it.dismissed || USER_CLOSED.indexOf(it.status) !== -1;
    it.isNew = (raw.foundDate && daysSince(raw.foundDate) <= NEW_DAYS);

  document.getElementById('restore-file').addEventListener('change', function (e) {
    var f = e.target.files[0]; if (!f) return; var rd = new FileReader();

      try {
        var d = JSON.parse(rd.result);

        (d.applications || []).forEach(function (a) {
          var dup = apps.some(function (x) { return x.id === a.id || (x.company === a.company && (x.title || '') === (a.title || '')); });
          if (!dup) { if (!a.id) a.id = uid(); apps.push(a); }
        });
        (d.interests || []).forEach(function (n) { if (interests.indexOf(n) === -1) interests.push(n); });
        saveAll(); tab = 'apps'; render(); alert('복원했습니다.');
      } catch (err) { alert('백업 파일을 읽지 못했습니다.'); }
      e.target.value = '';
    };
    rd.readAsText(f);
  });

  // ---------- 데이터 불러오기 ----------
  function getJSON(path) { return fetch(path, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }); }
  Promise.all([
    getJSON('data/postings.json').catch(function () { return null; }),
    getJSON('data/companies.json').catch(function () { return null; }),
    getJSON('data/meta.json').catch(function () { return null; }),
    getJSON('data/curation.json').catch(function () { return null; })
  ]).then(function (res) {
    var p = res[0], cur = res[3];
    if (p) {
      var items = (p.items || []).slice();
      if (cur) {
        var ovs = cur.overrides || {};
        items = items.map(function (it) { var o = ovs[it.id]; if (!o) return it; var m = {}; for (var k in it) m[k] = it[k]; for (var k2 in o) m[k2] = o[k2]; return m; });
        (cur.add || []).forEach(function (a) { if (!items.some(function (x) { return x.id === a.id; })) items.push(a); });
      }
      discovered = items.filter(function (it) { return !it.person || it.person === 'wife'; });
      if (p.lastUpdated) { var lu = new Date(p.lastUpdated); document.getElementById('last-updated').textContent = '마지막 자동 수집·재확인: ' + lu.getFullYear() + '.' + pad(lu.getMonth() + 1) + '.' + pad(lu.getDate()) + ' ' + pad(lu.getHours()) + ':' + pad(lu.getMinutes()); }
    } else document.getElementById('last-updated').textContent = '자동 수집 데이터를 불러오지 못했습니다 (직접 추가는 가능합니다)';
    if (res[1]) companies = { companies: res[1].companies || [], trends: res[1].trends || [] };
    meta = res[2];
    if (meta && Array.isArray(meta.sources)) {
      var h = document.getElementById('src-health'); h.appendChild(document.createTextNode('수집 출처 상태: '));
      meta.sources.forEach(function (s) { h.appendChild(el('span', null, (s.ok ? '✓ ' : '✗ ') + s.name + (s.lastSuccess ? ' (' + md(s.lastSuccess) + ')' : ''))); });
    }
    render();
  });
})();
</script>
